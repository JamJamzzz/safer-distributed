# One Service load-balancing across the 3 worker replicas. This is what
# cmd/loadgen (and any real client) points at -- never an individual pod.
apiVersion: v1
kind: Service
metadata:
  name: safer-worker
  namespace: safer-distributed
  labels:
    app: safer-worker
spec:
  selector:
    app: safer-worker
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
