syntax = "proto3";

// Package worker.v1 is the wire surface of the SAFER worker service
// (cmd/worker).
//
// The worker is a stateless adapter around the existing SAFER client
// package (github.com/JamJamzzz/safer-distributed/client): every RPC opens
// or reuses this process's MongoDB and coordinator connections and calls
// straight into the same InitUser/StoreFile/AppendToFile/LoadFile logic
// SAFER-CC has always had. No new cryptography, storage, or locking
// semantics are introduced here.
//
// The surface is intentionally the minimum needed to drive a realistic
// deployment/load test, not a mechanical export of every SAFER method.
//
// Every RPC carries the caller's username and password: SAFER derives a
// user's keys from that pair on every call rather than keeping
// server-side session state (see client.GetUser), so the worker itself
// holds no per-user state between requests and any replica can serve any
// request.
//
// SECURITY: this channel is NOT suitable for exposure to an untrusted
// network, and is meaningfully higher-risk than the lock coordinator's
// channel (proto/coordinator/v1). The coordinator only ever carries
// resource identifiers and lock modes, because SAFER encrypts and
// authenticates its objects before anything reaches storage or the lock
// layer. This service sits BEFORE that encryption: every request here
// carries the caller's PLAINTEXT username and password, and StoreFile/
// AppendToFile carry PLAINTEXT file content the worker has not encrypted
// yet. Like the coordinator, cmd/worker dials and serves this
// insecure.NewCredentials() -- no transport encryption, no endpoint
// authentication -- so anything that can observe or reach this channel
// sees these bytes in the clear and can act as any user it can
// authenticate as. Restricting network reachability (a ClusterIP/
// headless Service, never a LoadBalancer/NodePort or a bare Ingress; see
// deploy/kubernetes/networkpolicy.yaml's worker-ingress rule) is the only
// mitigation this phase applies; it is access control at the network
// layer, not encryption or cryptographic identity, and does not make this
// channel safe to expose beyond a trusted cluster network. Building
// mTLS/PKI for this channel is out of scope for this phase.
package worker.v1;

option go_package = "github.com/JamJamzzz/safer-distributed/proto/worker/v1;workerv1";

message InitUserRequest {
  string username = 1;
  string password = 2;
}

message InitUserResponse {}

message StoreFileRequest {
  string username = 1;
  string password = 2;
  string filename = 3;
  bytes content = 4;
}

message StoreFileResponse {}

message AppendToFileRequest {
  string username = 1;
  string password = 2;
  string filename = 3;
  bytes content = 4;
}

message AppendToFileResponse {}

message LoadFileRequest {
  string username = 1;
  string password = 2;
  string filename = 3;
}

message LoadFileResponse {
  bytes content = 1;
}

// SaferWorker exposes enough of the SAFER client API to drive a realistic
// deployment and load test. It is deliberately not a full export of every
// SAFER operation.
service SaferWorker {
  rpc InitUser(InitUserRequest) returns (InitUserResponse);
  rpc StoreFile(StoreFileRequest) returns (StoreFileResponse);
  rpc AppendToFile(AppendToFileRequest) returns (AppendToFileResponse);
  rpc LoadFile(LoadFileRequest) returns (LoadFileResponse);
}
