# PLACEHOLDER for local/dev use only. Do not commit real credentials here.
#
# A real deployment should create this Secret out-of-band instead of
# applying this file verbatim -- e.g.:
#
#   kubectl create secret generic safer-mongo-credentials \
#     --namespace safer-distributed \
#     --from-literal=SAFER_MONGO_URI='mongodb://<user>:<pass>@<host>:27017/?replicaSet=rs0'
#
# or through a secrets manager / external-secrets / sealed-secrets
# integration, none of which this repository's scope covers (see
# docs/distributed-roadmap.md's explicitly-out-of-scope list).
apiVersion: v1
kind: Secret
metadata:
  name: safer-mongo-credentials
  namespace: safer-distributed
type: Opaque
stringData:
  SAFER_MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0&directConnection=true"
