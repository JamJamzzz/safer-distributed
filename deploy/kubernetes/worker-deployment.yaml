# Workers are stateless (see cmd/worker's package doc) and safely
# replicated: correctness under concurrent replicas comes from the shared
# coordinator's strict 2PL and fencing, not from anything workers
# coordinate among themselves. RollingUpdate (the Kubernetes default) is
# fine here, unlike the coordinator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safer-worker
  namespace: safer-distributed
  labels:
    app: safer-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: safer-worker
  template:
    metadata:
      labels:
        app: safer-worker
    spec:
      # Bounded by cmd/worker's own -shutdown-timeout (25s default): give
      # Kubernetes a little more than that before it SIGKILLs, so the
      # worker's own bounded GracefulStop is what ends the pod in the
      # normal case, not an external kill.
      terminationGracePeriodSeconds: 35
      containers:
        - name: worker
          image: safer-worker:local
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=0.0.0.0:50052"
            # DefaultAuthConcurrency (2, see cmd/worker/config.go's doc)
            # is repeated explicitly here rather than left implicit, so
            # the number that this deployment's memory limit below is
            # actually sized against is visible in the same file.
            - "-auth-concurrency=2"
          ports:
            - name: grpc
              containerPort: 50052
          envFrom:
            - configMapRef:
                name: safer-config
            - secretRef:
                name: safer-mongo-credentials
          # Readiness and liveness are deliberately different checks (see
          # cmd/worker/health.go).
          #
          # Readiness (the default/"" gRPC health service) reflects
          # MongoDB and coordinator reachability: an unready worker is
          # taken out of the Service's endpoint list, so Kubernetes
          # routes new requests to a replica that can actually serve them.
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          # Liveness only asks "is this process's serve loop alive", and
          # is set once at startup, never toggled by a downstream outage.
          # A shared MongoDB or coordinator outage must not fail every
          # worker replica's liveness probe at once -- that would make
          # Kubernetes kill and restart the entire fleet simultaneously,
          # which cannot repair an outage in a dependency and can only
          # add a thundering restart on top of it.
          livenessProbe:
            grpc:
              port: 50052
              service: liveness
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Development defaults, evidence-informed but NOT production
            # capacity planning (Phase 4.6; see docs/distributed-
            # roadmap.md's Phase 4.6 section for the full measurement).
            #
            # A first live run at the original 256Mi limit OOM-killed all
            # three worker replicas under the checked-in loadgen Job's
            # own default concurrency. Measuring at controlled loadgen
            # concurrency levels (1/2/4/8) against real kind pods found:
            # a worker settles at roughly 150-165Mi of resident memory
            # after any burst of concurrent GetUserContext/InitUserContext
            # activity (each call performs an Argon2 key derivation or
            # RSA/DS key generation, and Go's allocator does not hand
            # that memory back to the OS quickly, so the level persists
            # between bursts rather than decaying -- confirmed stable
            # across repeated runs, not growing further, so this is
            # concurrency pressure, not a leak); two such calls
            # genuinely overlapping in one process reached as much as
            # ~217Mi observed; four or more overlapping reliably
            # exceeded 256Mi and triggered the OOM kill this comment
            # describes.
            #
            # -auth-concurrency=2 above caps the worst case at two
            # overlapping calls per process, so these values are sized
            # against that ceiling with headroom for measurement
            # granularity, not against unbounded concurrency:
            #   request: covers the ~165Mi steady-state plateau
            #   limit: comfortably covers the ~217Mi two-concurrent peak
            # CPU requests/limits are unchanged from Phase 4's original
            # conservative defaults; nothing in this measurement bore on
            # them.
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
