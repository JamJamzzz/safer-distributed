syntax = "proto3";

// Package coordinator.v1 is the wire surface of the SAFER lock
// coordinator.
//
// The surface is deliberately small and strict-2PL-shaped.
//
// There is no BeginTransaction RPC. A transaction's identity is a UUID the
// worker generates locally, which costs nothing and cannot collide across
// workers; the coordinator creates transaction state lazily on the first
// Acquire. A separate Begin would add a round trip and a second failure
// mode (a transaction that exists on the coordinator but whose creating
// worker never learned it) for no gain in this phase.
//
// There is no per-resource Release. Under strict two-phase locking a
// transaction holds every lock it takes until it ends, so the only way to
// release is EndTransaction, which releases all of them at once. Offering
// early release would hand callers a way to violate the protocol.
//
// Transactions carry a lease. The coordinator is authoritative for the
// deadline; a worker renews it while it works. A passed deadline does not
// release anything by itself -- it only makes the transaction eligible for
// revocation, which is a deliberate, ordered process on the coordinator.
//
// Exclusive grants carry a fencing token. Shared grants do not: a stale
// reader cannot corrupt anything, and issuing tokens for readers would
// serialize them against each other for no benefit.
package coordinator.v1;

option go_package = "github.com/JamJamzzz/safer-distributed/proto/coordinator/v1;coordinatorv1";

// LockMode mirrors lockmanager.LockMode. UNSPECIFIED exists so that a
// caller that forgets to set the field is rejected rather than silently
// treated as a shared request.
enum LockMode {
  LOCK_MODE_UNSPECIFIED = 0;
  LOCK_MODE_SHARED = 1;
  LOCK_MODE_EXCLUSIVE = 2;
}

// ResourceType mirrors lockmanager.ResourceType. The coordinator never
// branches on it; it is part of the resource's identity.
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_NAMESPACE = 1;
  RESOURCE_TYPE_FILE = 2;
}

// ResourceId identifies one logical lockable resource, exactly as
// lockmanager.ResourceID does. The key is derived by the worker from
// SAFER's own canonical encoding; the coordinator treats it as opaque.
message ResourceId {
  ResourceType type = 1;
  string key = 2;
}

message AcquireRequest {
  // transaction_id is a UUID generated by the worker. The coordinator
  // creates transaction state on first use and maps it to an internal
  // lock-manager transaction id.
  string transaction_id = 1;
  ResourceId resource = 2;
  LockMode mode = 3;
}

message AcquireResponse {
  // fencing_token is set only for exclusive grants, and is zero for
  // shared ones. It is allocated durably before this response is sent, so
  // a worker never receives an unfenced exclusive grant.
  //
  // Retrying an identical Acquire returns the SAME token rather than
  // allocating a new one, so a retry after a lost response recovers the
  // original outcome instead of inventing a second grant.
  uint64 fencing_token = 1;

  // lease_expires_unix_nano is the coordinator's authoritative deadline
  // for this transaction. It is advisory to the worker -- the coordinator
  // decides when a lease has passed -- but it tells the worker how often
  // it must renew.
  int64 lease_expires_unix_nano = 2;
}

message RenewLeaseRequest {
  string transaction_id = 1;
}

message RenewLeaseResponse {
  int64 lease_expires_unix_nano = 1;
}

message EndTransactionRequest {
  string transaction_id = 1;
}

message EndTransactionResponse {
  // released is how many resources the transaction was holding. It is
  // zero for a transaction that never acquired anything, including one
  // the coordinator has never heard of, since ending an unknown
  // transaction is idempotent rather than an error.
  uint32 released = 1;
}

message HealthRequest {}

message HealthResponse {
  // active_transactions and held_locks are operational visibility, not a
  // protocol guarantee. They are a point-in-time sample.
  uint32 active_transactions = 1;
  uint32 held_locks = 2;
  // revoking_transactions counts transactions whose lease has passed and
  // whose cleanup is in progress. A number that stays above zero means
  // fence invalidation is failing and locks are being held on purpose.
  uint32 revoking_transactions = 3;
}

// LockCoordinator serves strict-2PL lock decisions for multiple SAFER
// workers from one process.
service LockCoordinator {
  // Acquire blocks until the transaction holds the requested mode on the
  // resource. A cancelled or disconnected Acquire leaves the wait queue
  // and is never granted afterwards.
  rpc Acquire(AcquireRequest) returns (AcquireResponse);

  // EndTransaction releases every lock the transaction holds. It is
  // idempotent, and workers call it on every path, including after an
  // Acquire whose response never arrived.
  rpc EndTransaction(EndTransactionRequest) returns (EndTransactionResponse);

  // RenewLease extends a transaction's lease.
  //
  // It is idempotent: renewing repeatedly simply moves the deadline. It
  // fails once the transaction is being revoked or is gone, which is how
  // a worker learns it has lost its locks.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // Health reports that the coordinator is serving.
  rpc Health(HealthRequest) returns (HealthResponse);
}
