# Network isolation for Phase 4.5.
#
# Two DIFFERENT channels here carry very different risk if reached by an
# unintended pod, and this file's two allow rules are sized accordingly.
# Neither channel has transport encryption or endpoint authentication
# (both dial insecure.NewCredentials(); see client/coordination/grpccoord's
# package doc and cmd/worker's), so what follows is entirely about
# restricting WHICH pods can reach each one at the network layer -- not
# about encrypting or authenticating what an already-allowed pod sends,
# which stays out of scope for this phase (no mTLS/PKI project here).
#
#   - The COORDINATOR channel (client/coordination/grpccoord) carries only
#     resource identifiers and lock modes. SAFER encrypts and
#     authenticates its objects before anything reaches storage or the
#     lock layer, so this channel never carries plaintext file content or
#     credentials. A pod that can reach it could forge lock traffic and
#     disrupt correctness/availability, but it learns nothing confidential
#     by doing so.
#
#   - The WORKER channel (worker.v1, proto/worker/v1/worker.proto) is a
#     DIFFERENT and HIGHER-RISK boundary that did not exist before Phase 4:
#     it sits BEFORE SAFER's encryption layer, not after it. Every
#     InitUser/StoreFile/AppendToFile/LoadFile request carries the
#     caller's plaintext username and password (SAFER derives keys from
#     them per-call; see client.GetUserContext), and StoreFile/
#     AppendToFile carry plaintext file content the worker has not
#     encrypted yet. A pod that can reach the worker Service and is
#     handed (or guesses) a real username/password can read and write
#     that user's files, and anything that can merely observe this
#     channel's bytes -- which NetworkPolicy does not prevent for an
#     ALLOWED pod, only for a disallowed one -- sees them in the clear.
#     THE WORKER gRPC SURFACE IS NOT SUITABLE FOR EXPOSURE TO AN
#     UNTRUSTED NETWORK. Keeping it ClusterIP/headless (never a
#     LoadBalancer or NodePort Service, and never behind an Ingress
#     without a TLS-terminating, authenticating proxy in front of it,
#     neither of which this repository adds) and restricting its ingress
#     as tightly as the deployment can tolerate (see worker-ingress below)
#     are the only mitigations this phase applies. NetworkPolicy is
#     access control at the network layer, not encryption and not
#     cryptographic identity -- it does not make this channel safe to
#     expose beyond a trusted cluster network, it only narrows who is on
#     that network.
#
# default-deny-ingress makes the allow rules below meaningful: without it,
# any pod that could reach the namespace's pod network at all would reach
# the coordinator and workers by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: safer-distributed
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Only worker pods may reach the coordinator. Nothing else in the
# namespace -- and nothing outside it -- has a network path to it. This is
# the concrete form of "coordinator ingress restricted to intended SAFER
# worker pods".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coordinator-ingress
  namespace: safer-distributed
spec:
  podSelector:
    matchLabels:
      app: safer-coordinator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: safer-worker
      ports:
        - protocol: TCP
          port: 50051
---
# Workers carry the higher-risk channel described above, so their ingress
# is narrowed to pods that opt in with the safer-client: "true" label,
# not to the whole namespace. loadgen-job.yaml carries this label; any
# other legitimate caller in this namespace adds the same label to its
# own pod template rather than being granted access implicitly by
# residing in the namespace. This is a labeling convention, not a named
# allowlist of specific pods -- it does not require editing this policy
# every time a new caller is added, and it does not "make the deployment
# unusable": any real client is one label away from working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
  namespace: safer-distributed
spec:
  podSelector:
    matchLabels:
      app: safer-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              safer-client: "true"
      ports:
        - protocol: TCP
          port: 50052
